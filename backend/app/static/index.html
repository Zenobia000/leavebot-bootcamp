<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LeaveBot請假</title><link rel="stylesheet" href="/style.css"></head><body><main><h1>請假登記</h1><p>送出後即可查看自己的待審核假單。</p><form id="leave-form"><label>員工<select name="employee_id" id="employee" required></select></label><label>假別<select name="leave_type"><option value="annual">特休</option><option value="personal">事假</option><option value="sick">病假</option></select></label><label>開始日期<input type="date" name="start_date" required></label><label>結束日期<input type="date" name="end_date" required></label><label>時段<select name="period"><option value="full">整天</option><option value="am">上午</option><option value="pm">下午</option></select></label><label>理由（選填，最多500字）<textarea name="reason" maxlength="500"></textarea></label><button type="submit">送出請假</button></form><p id="message" role="status" aria-live="polite"></p><h2>我的假單</h2><ul id="leaves"></ul></main><script src="/app.js"></script></body></html>
